<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<title>Patient perception of AI-assisted diagnosis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --maroon:#73000A; --gold:#B59A57; --orange:#B7410E; --teal:#527B82; --green:#788A38;
  --bg:#F2F3F0; --surface:#FFFFFF; --surface2:#F7F8F5;
  --ink:#16180F; --body:#3A3D35; --mute:#6C7065; --faint:#9A9D93;
  --line:#DCDED6; --line2:#ECEEE8;
  --t1:34px; --t2:22px; --t3:17px; --t4:15px; --t5:13px;
  --s1:8px; --s2:12px; --s3:16px; --s4:24px; --s5:36px; --s6:56px;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#131512; --surface:#1B1D19; --surface2:#222520;
  --ink:#ECEEE6; --body:#C2C5BC; --mute:#90948A; --faint:#6B6F66;
  --line:#333630; --line2:#272A25;
  --maroon:#B0414A; --gold:#C8B077; --orange:#D96A3A; --green:#9DB258;
}}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:var(--t3);line-height:1.6;}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.1px;}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit;}

.band{background:var(--maroon);color:#fff;}
.band .in{max-width:760px;margin:0 auto;padding:var(--s3) var(--s4);
          padding-top:calc(var(--s3) + env(safe-area-inset-top,0px));
          display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;}
.band .nm{font-family:var(--serif);font-size:var(--t2);font-weight:600;}
.band .sb{font-size:var(--t4);color:#E3C8CB;}
.prog{height:3px;background:rgba(255,255,255,.22);}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

main{max-width:760px;margin:0 auto;padding:var(--s5) var(--s4) var(--s6);}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:var(--s5);}
@media (max-width:620px){ .screen{padding:var(--s4);} }

.step{font-size:var(--t5);letter-spacing:1px;text-transform:uppercase;
      color:var(--gold);font-weight:600;}
h1.ttl{font-size:var(--t1);line-height:1.18;margin-top:var(--s2);}
h2.sec{font-size:var(--t2);line-height:1.3;}
.intro{font-family:var(--serif);font-size:19px;line-height:1.65;color:var(--body);margin-top:var(--s3);}
.intro p{margin:0;} .intro p + p{margin-top:var(--s2);}

/* stimulus */
.stim{border:1px solid var(--line2);border-radius:3px;background:var(--surface2);
      padding:var(--s4);margin-top:var(--s4);}
.stim h2{font-family:var(--serif);font-size:27px;line-height:1.2;}
.stim .say{font-family:var(--serif);font-size:19px;line-height:1.6;color:var(--body);
           margin-top:var(--s2);}
.fig{width:320px;max-width:100%;margin:var(--s4) auto 0;border:1px solid var(--line);
     border-radius:2px;overflow:hidden;background:#0A0C09;position:relative;line-height:0;}
.fig img{width:100%;display:block;}
.fig svg.ov{position:absolute;inset:0;width:100%;height:100%;}
.figcap{text-align:center;font-size:var(--t5);color:var(--faint);margin-top:var(--s1);}
.soft{font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--body);margin-top:var(--s4);}
.verif{display:flex;gap:var(--s2);align-items:flex-start;margin-top:var(--s3);
       border-left:3px solid var(--green);padding-left:var(--s2);font-family:var(--serif);
       font-size:18px;line-height:1.55;color:var(--body);}
.verif svg{width:18px;height:18px;fill:var(--green);flex:0 0 18px;margin-top:5px;}
.verif b{font-weight:600;color:var(--ink);}

.bar{height:3px;background:var(--line);overflow:hidden;margin-top:var(--s4);}
.bar i{display:block;height:100%;background:var(--maroon);width:0;transition:width .2s linear;}
.sname{font-family:var(--serif);font-size:var(--t2);font-weight:600;margin-top:var(--s3);}
.sdesc{font-family:var(--serif);font-size:18px;color:var(--body);margin-top:4px;min-height:3.2em;}
.stepnav{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s3);}
.stepnav button{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:2px;
                padding:var(--s1) var(--s3);font-size:var(--t4);}
.stepnav button:hover{border-color:var(--maroon);}
.stepnav button.go{background:var(--maroon);border-color:var(--maroon);color:#fff;}
.ticks{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1) var(--s3);margin-top:var(--s2);}
.ticks div{font-size:var(--t4);color:var(--green);display:flex;gap:var(--s1);align-items:center;}
.ticks div b{width:16px;height:16px;border-radius:8px;border:2px solid currentColor;flex:0 0 16px;
             display:grid;place-items:center;font-size:9px;}
.film{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;margin-top:var(--s2);}
.film::-webkit-scrollbar{display:none;}
.film div{flex:0 0 58px;border-radius:2px;overflow:hidden;background:#0A0C09;}
.film img{width:100%;height:50px;object-fit:cover;object-position:50% 38%;display:block;}
.film span{display:block;font-size:8.5px;padding:2px 4px;color:#9AA09A;white-space:nowrap;}
.film span.hit{color:#C7D89B;}
.counter{font-size:var(--t5);color:var(--body);margin-top:var(--s2);font-variant-numeric:tabular-nums;}
@keyframes sweep{from{transform:translateY(-100%);}to{transform:translateY(100%);}}
.sweep{position:absolute;left:0;right:0;height:36%;z-index:2;pointer-events:none;
       background:linear-gradient(180deg,rgba(82,123,130,0),rgba(82,123,130,.45),rgba(82,123,130,0));
       animation:sweep .8s linear infinite;}
@keyframes dash{to{stroke-dashoffset:0;}}
.ov .dr{stroke-dasharray:900;stroke-dashoffset:900;animation:dash .4s ease-out forwards;}
@keyframes pop{0%{opacity:0;transform:scale(.72);}60%{opacity:1;transform:scale(1.05);}
               100%{opacity:1;transform:scale(1);}}
.ov .pop{transform-origin:171px 237px;animation:pop .3s ease-out both;}

/* questions */
.qs{margin-top:var(--s5);}
.q{padding-top:var(--s4);margin-top:var(--s4);border-top:1px solid var(--line2);}
.q:first-child{border-top:0;margin-top:0;padding-top:0;}
.qnum{font-size:var(--t5);color:var(--gold);font-weight:600;letter-spacing:.8px;}
.qtext{font-size:var(--t3);font-weight:500;margin-top:3px;}
.qhelp{font-size:var(--t4);color:var(--mute);margin-top:3px;}
.hd{font-family:var(--serif);font-size:var(--t2);font-weight:600;
    border-bottom:2px solid var(--gold);padding-bottom:var(--s1);margin-top:var(--s5);}
.q.first-after-hd{border-top:0;}
.opts{display:grid;gap:6px;margin-top:var(--s2);}
.opts label{display:flex;gap:var(--s2);align-items:flex-start;cursor:pointer;
            border:1px solid var(--line);border-radius:3px;padding:10px var(--s3);
            font-size:var(--t4);background:var(--surface2);}
.opts label:hover{border-color:var(--maroon);}
.opts label.on{border-color:var(--maroon);background:#F7EEEF;}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .opts label.on{background:#2B1A1C;} }
.opts input{margin:4px 0 0;accent-color:var(--maroon);flex:0 0 auto;}
.sl{margin-top:var(--s2);}
.sl input{width:100%;accent-color:var(--maroon);}
.sl .ends{display:flex;justify-content:space-between;gap:var(--s3);font-size:var(--t5);
          color:var(--mute);margin-top:2px;}
.sl .v{font-size:var(--t4);color:var(--maroon);text-align:right;font-variant-numeric:tabular-nums;}
.alloc{display:grid;gap:var(--s1);margin-top:var(--s2);}
.alloc .row{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:var(--s3);align-items:center;
            font-size:var(--t4);}
.alloc input{border:1px solid var(--line);border-radius:3px;padding:7px var(--s2);text-align:right;
             background:var(--surface);width:100%;}
.alloc .tot{font-size:var(--t4);text-align:right;margin-top:2px;}
.alloc .tot.bad{color:var(--orange);} .alloc .tot.ok{color:var(--green);}
input.num{border:1px solid var(--line);border-radius:3px;padding:9px var(--s2);width:140px;
          background:var(--surface);margin-top:var(--s2);}
textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:var(--s2);
         background:var(--surface);min-height:88px;font-size:var(--t4);margin-top:var(--s2);}

.nav{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s5);padding-top:var(--s4);
     border-top:1px solid var(--line2);}
.nav button{cursor:pointer;border-radius:3px;padding:12px var(--s4);font-size:var(--t3);
            font-weight:500;border:1px solid var(--maroon);background:var(--maroon);color:#fff;}
.nav button.ghost{background:transparent;color:var(--maroon);}
.nav button:disabled{opacity:.4;cursor:default;}
.nav .note{font-size:var(--t4);color:var(--mute);margin-left:auto;}
.consent{font-family:var(--serif);font-size:18px;line-height:1.65;color:var(--body);}
.consent p{margin:0;} .consent p + p{margin-top:var(--s2);}
.consent ul{margin:var(--s2) 0 0;padding-left:20px;} .consent li{margin-bottom:6px;}
.end{text-align:center;padding:var(--s6) 0;}
.end h1{font-size:var(--t1);} .end p{font-family:var(--serif);font-size:19px;color:var(--body);
        margin-top:var(--s3);}
</style>

<div class="band">
  <div class="in"><span class="nm">Elon University</span>
    <span class="sb">Patient perception of AI-assisted diagnosis</span></div>
  <div class="prog"><i id="prog"></i></div>
</div>
<main><div class="screen" id="screen"></div></main>

    {id:"s2", step:"Part two, stage two", title:"The same result, with more detail", stim:"2",

     items:CORE("s2")},

    {id:"s3", step:"Part two, stage three", title:"The same result, after review", stim:"3",
     lead:"The same result is shown once more, with one further piece of information.",
     items:CORE("s3")},

    {id:"post", step:"Part three", title:"What you took from it", items:[
      hd("Understanding"),
      sl("p_u","How well do you feel you understand how this result was produced?",
         "Not at all","Completely"),
      mc("u1","What information did the software have when it read the image?",
         ["The X-ray and the patient's medical history","The X-ray only",
          "The X-ray and blood test results","I don't know"]),
      mc("u2","Which step would have caught a blurred image?",
         ["The pattern comparison","The bone outlining","The image quality check","I don't know"]),
      mc("u3","If the software had marked an area at the tip of the ulna, what would that mean?",
         ["That bone is definitely broken","It found a pattern there that it links to a fracture",
          "It found nothing there","I don't know"]),
      mc("u4","What did the radiologist add that the software does not do?",
         ["Took the X-ray","Nothing","Confirmed the finding and signed the report","I don't know"]),

      hd("Trust, asked again"),
      sl("a_sw","How much would you trust a diagnostic result produced by a computer program?",
         "Not at all","Completely"),
      sl("a_rad","How much would you trust a diagnostic result produced by a radiologist?",
         "Not at all","Completely"),
      sl("a_sys","How much would you trust the health system that provides your care?",
         "Not at all","Completely"),
      {t:"alloc",id:"a_alloc",q:"Divide one hundred points across the three again.",
       rows:["The computer program","The radiologist","The health system"]},

      hd("The result you saw"),
      sl("r_trust","How much do you trust the result you saw?","Not at all","Completely"),
      sl("r_sat","How satisfied are you with how the result was communicated?",
         "Very dissatisfied","Very satisfied"),
      sl("r_act","How confident would you feel acting on a result like this?","Not at all","Completely"),
      sl("v_improved","The involvement of a radiologist improved the result.",
         "Strongly disagree","Strongly agree"),
      sl("v_personal","The radiologist's involvement made the result feel more personal to my case.",
         "Strongly disagree","Strongly agree"),

      hd("Closing"),
      mc("source","Which of these is closest to how the result you saw was produced?",
         ["A computer program produced it on its own",
          "A computer program produced it and a radiologist verified it",
          "A radiologist produced it, with no computer program involved",
          "I could not tell from what I was shown"]),
      mc("willing","After this study, would you be willing to receive a diagnosis from an AI system?",
         ["Yes","No","Unsure"]),
      mc("impact","Which approach do you believe will have the most positive impact on healthcare?",
         ["AI alone","AI with a clinician","Clinicians alone","Unsure"]),
      sl("impact2","What impact do you believe AI will have on healthcare?",
         "Very negative","Very positive"),
      {t:"txt",id:"open",q:"In your own words, what would have made you more confident about the " +
       "result you saw?"},
      mc("attn","To show you are reading carefully, please select the third option.",
         ["First option","Second option","Third option","Fourth option"]),
      mc("serious","How carefully did you answer?",
         ["Very carefully","Fairly carefully","Not very carefully, my answers should not be used"])
    ]},

    {id:"end", kind:"end"}
  ];

  var si = 0;

  /* ---------- stimulus ---------- */
  var SOFT = "This finding was produced by computer-aided detection software that analysed the X-ray " +
             "and marked the area circled above.";
  var STAGES=[
    {n:"Image quality check",
     d:"The software first checks the X-ray can be read at all. Blurring, poor positioning or metal " +
       "in the field returns no result."},
    {n:"Bone outlining",
     d:"It traces the outline of every bone in the field, so any area it marks can be attributed to a " +
       "named bone."},
    {n:"Pattern comparison",
     d:"It compares those outlines against X-rays that were previously read and labelled, looking for " +
       "the patterns that appeared in the ones labelled as fractured."},
    {n:"Area marked",
     d:"It marks the one area that matched. Here a thin dark line crosses the bone and the smooth edge " +
       "of the bone steps out of line."}
  ];
  var st=0, timer=null, playing=false;

  function ovFor(s){
    var g="";
    if(s>=2){
      g+='<g fill="none" stroke="#9FC27F" stroke-width="1.8" opacity=".95">';
      BONES.forEach(function(d,i){
        g+='<path class="dr" d="'+d+'" style="animation-delay:'+(i*0.03).toFixed(2)+'s"/>'; });
      g+='</g>';
    }
    if(s===3) g+='<rect x="'+(MARK.x-8)+'" y="'+(MARK.y-8)+'" width="'+(MARK.w+16)+'" height="'+
      (MARK.h+16)+'" fill="none" stroke="#DDA510" stroke-width="2" stroke-dasharray="4 5"/>';
    if(s>=4) g+='<g class="pop">'+circle()+'</g>';
    return g;
  }
  function slotFor(s){
    if(s===1) return '<div class="ticks">'+
      ['Exposure adequate','Positioning standard','No motion','No metal in field'].map(function(x){
        return '<div><b>&#10003;</b><span>'+x+'</span></div>';}).join("")+'</div>';
    if(s===3){
      var f=[["fracture",1],["fracture",1],["no fracture",0],["fracture",1],["no fracture",0],
             ["fracture",1]];
      return '<div class="film">'+f.map(function(x,i){
        return '<div><img src="'+(x[1]?IMG:NORM)+'" alt="" style="filter:brightness('+
          (0.78+0.1*(i%3))+')"><span class="'+(x[1]?"hit":"")+'">'+x[0]+'</span></div>';}).join("")+
        '</div><div class="counter" id="cnt">0 X-rays compared</div>';
    }
    return "";
  }
  function paintSteps(){
    var ov=document.getElementById("ov"); if(!ov) return;
    ov.innerHTML=ovFor(st);
    var sw=document.getElementById("swp"); if(sw) sw.className=(st===1)?"sweep":"";
    document.getElementById("bar").style.width=(st/4*100)+"%";
    document.getElementById("sname").textContent=st?STAGES[st-1].n:"Four steps";
    document.getElementById("sdesc").textContent=st?STAGES[st-1].d
      :"The X-ray as it was taken, before the software read it.";
    document.getElementById("slot").innerHTML=slotFor(st);
    document.getElementById("play").textContent=playing?"Pause":(st>=4?"Play again":"Play");
    if(st===3) countUp();
  }
  function countUp(){
    var el=document.getElementById("cnt"); if(!el) return;
    var t0=Date.now();
    var iv=setInterval(function(){
      var p=Math.min(1,(Date.now()-t0)/600);
      el.textContent=Math.round(20000*p).toLocaleString()+" X-rays compared"+
        (p>=1?", 1,184 matched this pattern":"");
      if(p>=1) clearInterval(iv);
    },40);
  }
  function stopS(){ if(timer){clearTimeout(timer);timer=null;} playing=false; }
  function stepS(){
    if(st>=4){ stopS(); paintSteps(); return; }
    st++; log("stage",st); paintSteps();
    if(playing) timer=setTimeout(stepS, st===3?1300:1000);
  }

  function stimHtml(k){
    var h='<div class="stim"><h2>Your wrist is broken.</h2>' +
      '<div class="say">A small crack across the wide part of the larger forearm bone, close to the ' +
      'wrist. The bone has not moved out of place, so a splint is what this needs.</div>' +
      '<div class="fig"><img src="'+IMG+'" alt="X-ray of a right wrist">' +
      (k==="2"?'<div id="swp"></div>':'') +
      '<svg class="ov" id="ov" viewBox="'+VB+'" preserveAspectRatio="none">'+
      (k==="2"?"":circle())+'</svg></div>' +
      '<div class="figcap">Right wrist, front view.</div>' +
      '<div class="soft">'+esc(k==="2"
        ? "This finding was produced by computer-aided detection software that analysed the X-ray."
        : SOFT)+'</div>';
    if(k==="3") h+='<div class="verif">'+TICK+'<span><b>Verified by a radiologist.</b> A radiologist ' +
      'reviewed the X-ray and the software marking, confirmed the finding and signed the report.' +
      '</span></div>';
    if(k==="2") h+='<div class="bar"><i id="bar"></i></div>' +
      '<div class="sname" id="sname"></div><div class="sdesc" id="sdesc"></div>' +
      '<div id="slot"></div><div class="stepnav">' +
      '<button type="button" id="play" class="go">Play</button>' +
      '<button type="button" id="back">Back</button>' +
      '<button type="button" id="fwd">Next step</button></div>';
    return h+'</div>';
  }

  /* ---------- question rendering ---------- */
  function visible(it){
    if(!it.only) return true;
    var p=it.only.split("="); return String(D[p[0]])===p[1];
  }
  function itemsHtml(items){
    var h='', n=0, afterHd=false;
    items.forEach(function(it){
      if(!visible(it)) return;
      if(it.t==="hd"){ h+='<div class="hd">'+esc(it.q)+'</div>'; afterHd=true; return; }
      n++;
      h+='<div class="q'+(afterHd?" first-after-hd":"")+'"><div class="qnum">Q'+n+'</div>' +
         '<div class="qtext">'+esc(it.q)+'</div>' +
         (it.help?'<div class="qhelp">'+esc(it.help)+'</div>':'');
      afterHd=false;
      if(it.t==="sl"){
        var v=D[it.id];
        h+='<div class="sl"><input type="range" min="0" max="100" value="'+(v===undefined?50:v)+
           '" data-sl="'+it.id+'"><div class="ends"><span>'+esc(it.lo)+'</span><span>'+esc(it.hi)+
           '</span></div><div class="v">'+(v===undefined?"not answered":v)+'</div></div>';
      }
      if(it.t==="mc"){
        h+='<div class="opts">'+it.opts.map(function(o,j){
          var on=D[it.id]===j;
          return '<label class="'+(on?"on":"")+'"><input type="radio" name="'+it.id+'" value="'+j+
                 '" data-mc="'+it.id+'"'+(on?" checked":"")+'><span>'+esc(o)+'</span></label>';
        }).join("")+'</div>';
      }
      if(it.t==="ck"){
        var cur=D[it.id]||[];
        h+='<div class="opts">'+it.opts.map(function(o,j){
          var on=cur.indexOf(j)>=0;
          return '<label class="'+(on?"on":"")+'"><input type="checkbox" value="'+j+
                 '" data-ck="'+it.id+'"'+(on?" checked":"")+'><span>'+esc(o)+'</span></label>';
        }).join("")+'</div>';
      }
      if(it.t==="num"){
        h+='<input class="num" type="number" min="'+it.min+'" max="'+it.max+'" data-nm="'+it.id+
           '" value="'+(D[it.id]===undefined?"":D[it.id])+'">';
      }
      if(it.t==="alloc"){
        var a=D[it.id]||[0,0,0], tot=a[0]+a[1]+a[2];
        h+='<div class="alloc">'+it.rows.map(function(r,j){
          return '<div class="row"><span>'+esc(r)+'</span><input type="number" min="0" max="100" ' +
                 'value="'+a[j]+'" data-al="'+it.id+'" data-ix="'+j+'"></div>';}).join("")+
          '<div class="tot '+(tot===100?"ok":"bad")+'">Total '+tot+' of 100</div></div>';
      }
      if(it.t==="txt") h+='<textarea data-tx="'+it.id+'" placeholder="Optional">'+
        esc(D[it.id]||"")+'</textarea>';
      h+='</div>';
    });
    return h;
  }

  /* ---------- screens ---------- */
  function render(){
    var s=SCREENS[si], h="";
    document.getElementById("prog").style.width=(si/(SCREENS.length-1)*100)+"%";

    if(s.kind==="consent"){
      h='<div class="step">Before you begin</div><h1 class="ttl">What this study involves</h1>' +
        '<div class="consent" style="margin-top:var(--s4)">' +
        '<p>This study asks how people understand and judge a medical test result when a computer ' +
        'program has been involved in producing it. You will read one X-ray result three times, each ' +
        'time with a little more information about how it was produced, and answer a short set of ' +
        'questions after each.</p>' +
        '<p>It takes about fifteen minutes. There are no right or wrong answers to most of the ' +
        'questions, and a few knowledge questions have a correct answer and an option saying you do ' +
        'not know, which is an acceptable answer.</p>' +
        '<ul><li>The result you will read is not a real patient result and the X-ray is an example ' +
        'image.</li>' +
        '<li>Taking part is voluntary and you may stop at any point.</li>' +
        '<li>Your answers are recorded without your name attached.</li>' +
        '<li>There is no risk to you beyond that of ordinary everyday activity.</li></ul>' +
        '<p>Questions about this study can go to the principal investigator, Vinayaka Gude, ' +
        'Department of Management and Entrepreneurship, Elon University, vgude@elon.edu.</p></div>' +
        '<div class="qs" id="qs">'+itemsHtml([mc("consent","Do you agree to take part?",
          ["Yes, I agree to take part","No, I do not wish to take part"])])+'</div>';
    } else if(s.kind==="end"){
      h='<div class="end"><h1>Thank you.</h1>' +
        '<p>Your responses have been recorded. Nothing you read in this study was a real patient ' +
        'result.</p></div>';
    } else {
      h='<div class="step">'+esc(s.step)+'</div><h1 class="ttl">'+esc(s.title)+'</h1>';
      if(s.lead) h+='<div class="intro"><p>'+esc(s.lead)+'</p></div>';
      if(s.stim) h+=stimHtml(s.stim);
      h+='<div class="qs" id="qs">'+itemsHtml(s.items)+'</div>';
    }

    if(s.kind!=="end"){
      h+='<div class="nav">' +
        (si>0?'<button type="button" class="ghost" id="back2">Back</button>':'') +
        '<button type="button" id="next">'+(si===0?"Begin":"Continue")+'</button>' +
        '<span class="note">Step '+(si+1)+' of '+SCREENS.length+'</span></div>';
    }
    document.getElementById("screen").innerHTML=h;
    if(s.stim==="2"){ st=0; stopS(); paintSteps(); }
    bind();
    window.scrollTo({top:0});
  }

  function bind(){
    var pl=document.getElementById("play");
    if(pl) pl.onclick=function(){
      if(playing){ stopS(); log("pause",st); paintSteps(); return; }
      if(st>=4) st=0;
      playing=true; log("play"); paintSteps(); stepS(); };
    var fw=document.getElementById("fwd");
    if(fw) fw.onclick=function(){ stopS(); if(st<4) st++; log("stage",st); paintSteps(); };
    var bk=document.getElementById("back");
    if(bk) bk.onclick=function(){ stopS(); if(st>0) st--; log("stage",st); paintSteps(); };

    document.querySelectorAll("[data-sl]").forEach(function(el){
      el.oninput=function(){ D[el.dataset.sl]=+el.value;
        el.parentNode.querySelector(".v").textContent=el.value; };
      el.onchange=function(){ log("answer",{id:el.dataset.sl,v:+el.value}); };
    });
    document.querySelectorAll("[data-nm]").forEach(function(el){
      el.onchange=function(){ D[el.dataset.nm]=el.value===""?undefined:+el.value;
        log("answer",{id:el.dataset.nm}); };
    });
    document.querySelectorAll("[data-tx]").forEach(function(el){
      el.onchange=function(){ D[el.dataset.tx]=el.value; log("answer",{id:el.dataset.tx}); };
    });
    document.querySelectorAll("[data-al]").forEach(function(el){
      el.oninput=function(){
        var id=el.dataset.al, a=D[id]||[0,0,0];
        a[+el.dataset.ix]=Math.max(0,Math.min(100,+el.value||0)); D[id]=a;
        var tot=a[0]+a[1]+a[2], t=el.closest(".alloc").querySelector(".tot");
        t.textContent="Total "+tot+" of 100"; t.className="tot "+(tot===100?"ok":"bad"); };
    });
    var nx=document.getElementById("next");
    if(nx) nx.onclick=function(){
      if(SCREENS[si].kind==="consent" && D.consent!==0){
        nx.textContent="Please agree to continue"; return; }
      log("screen_done",SCREENS[si].id);
      si=Math.min(SCREENS.length-1,si+1); render(); };
    var bk2=document.getElementById("back2");
    if(bk2) bk2.onclick=function(){ si=Math.max(0,si-1); render(); };
  }

  document.body.addEventListener("click",function(e){
    var t;
    if((t=e.target.closest("[data-mc]"))){
      var id=t.dataset.mc;
      D[id]=+t.value; log("answer",{id:id,v:+t.value});
      var box=t.closest(".opts");
      if(box) box.querySelectorAll("label").forEach(function(l){
        l.className = l.querySelector("input").checked ? "on" : ""; });
      if(id==="consent"){
        var nx=document.getElementById("next");
        if(nx) nx.textContent="Begin";
      }
      // only redraw if some later question appears or disappears because of this answer
      var sc=SCREENS[si], items=sc.items||[];
      var gates=items.some(function(x){ return x.only && x.only.indexOf(id+"=")===0; });
      if(gates){
        var y=window.scrollY;
        document.getElementById("qs").innerHTML=itemsHtml(items);
        bind();
        window.scrollTo(0,y);
      }
      return; }
    if((t=e.target.closest("[data-ck]"))){
      var id=t.dataset.ck, a=D[id]||[], v=+t.value, k=a.indexOf(v);
      if(t.checked && k<0) a.push(v); if(!t.checked && k>=0) a.splice(k,1);
      D[id]=a; t.closest("label").className=t.checked?"on":"";
      log("answer",{id:id,v:a.slice()}); return; }
  });

  log("open");
  render();
})();
</script>

</body></html>
